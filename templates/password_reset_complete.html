{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Password Updated | OpenSky</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(255,255,255,0.35), transparent 30%),
                linear-gradient(135deg, #064fb0, #08b7df);
        }

        .top-bar {
            height: 46px;
            background: rgba(255,255,255,0.96);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .sky-logo {
            width: 58px;
        }

        .top-links a {
            color: #555;
            font-size: 13px;
            text-decoration: none;
            margin-left: 16px;
        }

        .page-area {
            min-height: calc(100vh - 88px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card {
            width: 430px;
            background: white;
            border-radius: 18px;
            padding: 36px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.28);
            text-align: center;
        }

        .app-logo {
            width: 130px;
            margin-bottom: 10px;
        }

        .success-icon {
            width: 76px;
            height: 76px;
            margin: 14px auto 18px;
            border-radius: 50%;
            background: #e7f7ec;
            color: #16a34a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 38px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 10px;
            color: #111827;
            font-size: 26px;
        }

        p {
            color: #667085;
            font-size: 14px;
            line-height: 1.6;
            margin: 8px 0;
        }

        .login-btn {
            width: 100%;
            display: block;
            padding: 13px;
            margin-top: 24px;
            border-radius: 10px;
            background: #00a9df;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }

        .login-btn:hover {
            background: #008fc0;
        }

        .bottom-bar {
            height: 42px;
            background: rgba(255,255,255,0.96);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            font-size: 12px;
            color: #667085;
        }

        .bottom-bar a {
            color: #667085;
            text-decoration: none;
            margin-left: 15px;
        }
    </style>
</head>

<body>

<div class="top-bar">
    <img src="{% static 'images/sky.png' %}" class="sky-logo" alt="Sky">

    <div class="top-links">
        <a href="#">Help</a>
        <a href="#">Contact</a>
    </div>
</div>

<div class="page-area">
    <div class="card">

        <img src="{% static 'images/sky.png' %}" class="app-logo" alt="OpenSky">

        <div class="success-icon">✓</div>

        <h1>Password Updated</h1>

        <p>
            Your password has been changed successfully.
        </p>

        <p>
            You can now sign in with your new password.
        </p>

        <a href="{% url 'login' %}" class="login-btn">Back to Login</a>

    </div>
</div>

<div class="bottom-bar">
    <div>© 2025 Sky. All rights reserved.</div>

    <div>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
    </div>
</div>

</body>
</html>
