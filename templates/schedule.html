{% extends "base.html" %}

{% block content %}

<h2>📅 Schedule</h2>

<!-- TOP ROW -->
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <div>
        <strong>📅 Schedule</strong>
    </div>

    <div>
        👤 Sarah Johnson
    </div>
</div>


<!-- SECOND ROW (NAV + VIEW TOGGLES + UPCOMING TITLE) -->
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">

    <div>
        ◀ May 2026 ▶
    </div>

    <div>
        <button>Monthly</button>
        <button>Weekly</button>
        <button>Agenda</button>
    </div>

    <div>
        <strong>📌 Upcoming Schedule</strong>
    </div>

</div>


<!-- MAIN GRID -->
<div style="display:flex; gap:20px;">

    <!-- CALENDAR -->
    <div style="flex:2; border:1px solid #ccc; padding:15px;">

        <!-- DAYS -->
        <div style="display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-weight:bold;">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>

        <!-- DATES -->
        <div style="display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-top:10px; gap:10px;">

            <div>30</div>
            <div>31</div>
            <div style="background:#eef; padding:10px; border-radius:5px;">
                1<br>
                <small>10:00 AM</small>
            </div>

            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>

        </div>

    </div>


    <!-- UPCOMING -->
    <div style="flex:1; border:1px solid #ccc; padding:15px;">

        <h3>📌 Upcoming Schedule</h3>

        <div style="margin-bottom:15px;">
            <strong>10:00 AM - 11:00 AM</strong><br>
            Product Team
        </div>

        <!-- AVATARS -->
        <div style="display:flex; align-items:center; gap:5px; margin-bottom:10px;">

            <img src="https://ui-avatars.com/api/?name=John+Smith&background=0072ce&color=fff" style="width:30px; border-radius:50%;">
            <img src="https://ui-avatars.com/api/?name=Sarah+Johnson&background=28a745&color=fff" style="width:30px; border-radius:50%;">
            <img src="https://ui-avatars.com/api/?name=James+Brown&background=6f42c1&color=fff" style="width:30px; border-radius:50%;">

            <span style="margin-left:5px;">+3 more</span>

        </div>

    </div>

</div>


<!-- BUTTON -->
<div style="margin-top:20px;">
    <button style="
        width:100%;
        padding:12px;
        background:#0072ce;
        color:white;
        border:none;
        font-size:16px;
        cursor:pointer;
    ">
        ➕ Schedule Meeting
    </button>
</div>

{% endblock %}
