<!DOCTYPE html>
<!-- this tells the browser this is an HTML5 document -->

<html>
<head>
    <title>New Password</title>
    <!-- this is the title shown on the browser tab -->

    <style>
        /* this section is CSS. it controls how the page looks */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
        }
        /* this sets the page background to white and removes default spacing */

        .page-wrapper {
            min-height: 100vh;
            border: 18px solid #b5b5b5;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: white;
        }
        /* this creates a big outer box with a grey border and centers everything inside it */

        .container {
            background: white;
            width: 420px;
            padding: 30px;
        }
        /* this is the main box that holds the form */

        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        /* this centers the logo */

        .header img {
            width: 120px;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        /* this controls the size and position of the logo */

        h2 {
            text-align: center;
            font-weight: bold;
            margin-bottom: 5px;
        }
        /* this styles the title */

        .divider {
            height: 1px;
            background: #ccc;
            margin: 10px 0 20px 0;
        }
        /* this creates a thin line under the title */

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        /* this styles the input boxes (password fields) */

        button {
            width: 100%;
            padding: 10px;
            background-color: #0072ce;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        /* this styles the button */

        button:hover {
            background-color: #005fa3;
        }
        /* this changes button color when mouse is over it */

        .links {
            margin-top: 12px;
            text-align: center;
            font-size: 13px;
        }
        /* this styles the "Back to Login" link */

        .footer {
            position: absolute;
            bottom: 15px;
            right: 25px;
            font-size: 12px;
            color: grey;
            font-style: italic;
            text-align: right;
        }
        /* this places the footer text at the bottom right of the page */
    </style>
</head>

<body>

<div class="page-wrapper">
<!-- this is the outer container that holds everything -->

    <div class="container">
    <!-- this is the main white box in the middle -->

        <!-- this section shows the logo image from the "static/images" folder -->
        <div class="header">
            <img src="/static/images/sky.png" alt="SKY Logo">
        </div>

        <h2>Create New Password</h2>
        <!-- this is the title shown to the user -->

        <div class="divider"></div>
        <!-- this is a visual line -->

        <!-- this section shows messages from Django (like errors or success messages) -->
        {% if messages %}
            {% for message in messages %}
                <p style="color:red;">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <!-- this is a form that sends data to the server -->
        <form method="post">
            {% csrf_token %}
            <!-- this is a security token required by Django -->

            <!-- user types new password here -->
            <input type="password" name="new_password" placeholder="New Password">

            <!-- user types password again to confirm -->
            <input type="password" name="confirm_password" placeholder="Confirm Password">

            <!-- this button sends the form -->
            <button type="submit">Update Password</button>
        </form>

        <!-- this is a link to go back to login page -->
        <div class="links">
            <a href="/">Back to Login</a>
        </div>

<!---This page is used when the user wants to create a new password.
It shows a form with two inputs.
The user types the password and confirms it.
When they click the button, the data is sent to the server.
The page also shows messages from the system, like errors.-->
