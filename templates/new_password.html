{% load static %}

<!DOCTYPE html>
<html>
<head>
    <!-- This sets the page title. -->
    <title>New Password | OpenSky</title>

    <style>
        /* This sets the page colors. */
        :root {
            --transparentwhitecardcolor: rgba(255, 255, 255, 0.92);
            --maintextcolor: #0f172a;
            --mutedtextcolor: #64748b;
            --borderlinecolor: #e2e8f0;
            --mainbluecolor: #2563eb;
            --darkbluecolor: #1e40af;
            --softredcolor: #fee2e2;
            --bigboxshadow: 0 30px 80px rgba(2, 6, 23, 0.28);
            --boxroundcorner: 24px;
        }

        /* This makes width and height easier to control. */
        * {
            box-sizing: border-box;
        }

        /* This sets the page font and background. */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: var(--maintextcolor);
        }

        /* This styles the top and bottom bars. */
        .toplogolinksbar,
        .bottomfooterbar {
            height: 58px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        /* This adds a line under the top bar. */
        .toplogolinksbar {
            border-bottom: 1px solid #e5e7eb;
        }

        /* This styles the bottom bar. */
        .bottomfooterbar {
            border-top: 1px solid #e5e7eb;
            font-size: 12px;
            color: #64748b;
            font-weight: 700;
        }

        /* This styles the Sky logo. */
        .smallskylogo {
            width: 58px;
            display: block;
        }

        /* This holds top links. */
        .tophelpcontactlinks {
            display: flex;
            gap: 16px;
        }

        /* This styles top and bottom links. */
        .tophelpcontactlinks a,
        .bottomfooterbar a {
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
            font-weight: 800;
        }

        /* This adds space before bottom links. */
        .bottomfooterbar a {
            margin-left: 16px;
        }

        /* This changes links when the mouse is on them. */
        .tophelpcontactlinks a:hover,
        .bottomfooterbar a:hover {
            color: var(--mainbluecolor);
        }

        /* This styles the blue page area. */
        .newpasswordbluebackgroundarea {
            position: relative;
            overflow: hidden;
            min-height: calc(100vh - 116px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 34px 18px;
            background:
                radial-gradient(circle at 15% 18%, rgba(56, 189, 248, 0.55), transparent 28%),
                radial-gradient(circle at 85% 20%, rgba(37, 99, 235, 0.50), transparent 30%),
                radial-gradient(circle at 50% 85%, rgba(14, 165, 233, 0.45), transparent 32%),
                linear-gradient(135deg, #020617 0%, #0f2f6f 45%, #0284c7 100%);
        }

        /* This adds a glass effect on the background. */
        .newpasswordbluebackgroundarea::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(120deg, rgba(255,255,255,0.13), transparent 35%, rgba(255,255,255,0.08)),
                repeating-linear-gradient(
                    135deg,
                    rgba(255,255,255,0.04) 0px,
                    rgba(255,255,255,0.04) 1px,
                    transparent 1px,
                    transparent 18px
                );
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: none;
        }

        /* This adds a moving shine on the background. */
        .newpasswordbluebackgroundarea::after {
            content: "";
            position: absolute;
            top: -35%;
            left: -55%;
            width: 70%;
            height: 170%;
            background: linear-gradient(
                115deg,
                transparent 0%,
                rgba(255,255,255,0.04) 35%,
                rgba(255,255,255,0.32) 50%,
                rgba(255,255,255,0.05) 65%,
                transparent 100%
            );
            transform: rotate(8deg);
            animation: newpasswordbackgroundshineanimation 7s ease-in-out infinite;
            pointer-events: none;
        }

        /* This moves the page shine. */
        @keyframes newpasswordbackgroundshineanimation {
            0% {
                left: -65%;
                opacity: 0;
            }
            18% {
                opacity: 0.75;
            }
            50% {
                left: 120%;
                opacity: 0;
            }
            100% {
                left: 120%;
                opacity: 0;
            }
        }

        /* This styles the password card. */
        .newpasswordcardbox {
            position: relative;
            z-index: 1;
            overflow: hidden;
            width: 420px;
            background: var(--transparentwhitecardcolor);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,0.65);
            border-radius: var(--boxroundcorner);
            padding: 34px;
            box-shadow: var(--bigboxshadow);
            text-align: center;
        }

        /* This adds a soft shine inside the card. */
        .newpasswordcardbox::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background:
                linear-gradient(145deg, rgba(255,255,255,0.45), transparent 36%),
                linear-gradient(315deg, rgba(37,99,235,0.08), transparent 46%);
            pointer-events: none;
            z-index: 0;
        }

        /* This adds a moving shine on the card. */
        .newpasswordcardbox::after {
            content: "";
            position: absolute;
            top: -80%;
            left: -75%;
            width: 65%;
            height: 240%;
            background: linear-gradient(
                115deg,
                transparent,
                rgba(255,255,255,0.12),
                rgba(255,255,255,0.68),
                rgba(255,255,255,0.12),
                transparent
            );
            transform: rotate(18deg);
            animation: newpasswordcardshineanimation 4.8s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        /* This moves the card shine. */
        @keyframes newpasswordcardshineanimation {
            0% {
                left: -80%;
                opacity: 0;
            }
            20% {
                opacity: 0.9;
            }
            48% {
                left: 125%;
                opacity: 0;
            }
            100% {
                left: 125%;
                opacity: 0;
            }
        }

        /* This keeps card content above the shine. */
        .openskynewpasswordlogo,
        h2,
        .formseparateline,
        form,
        .backtologinlinkarea,
        .errormessagebox {
            position: relative;
            z-index: 1;
        }

        /* This styles the OpenSky logo. */
        .openskynewpasswordlogo {
            width: 132px;
            margin-bottom: 10px;
        }

        /* This styles the main title. */
        h2 {
            margin: 0;
            color: var(--maintextcolor);
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        /* This styles the small text under the title. */
        .textundertitle {
            position: relative;
            z-index: 1;
            font-size: 14px;
            color: var(--mutedtextcolor);
            margin-top: 8px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* This adds a line between title and form. */
        .formseparateline {
            height: 1px;
            background: var(--borderlinecolor);
            margin: 18px 0 20px;
        }

        /* This styles password inputs. */
        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            margin-bottom: 14px;
            border: 1px solid #dbe3ef;
            border-radius: 14px;
            font-size: 14px;
            color: var(--maintextcolor);
            background: rgba(255,255,255,0.86);
            outline: none;
            transition: 0.18s ease;
        }

        /* This highlights password inputs when clicked. */
        input:focus {
            border-color: var(--mainbluecolor);
            box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
            background: #ffffff;
        }

        /* This styles the update password button. */
        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--mainbluecolor), var(--darkbluecolor));
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 14px 30px rgba(37,99,235,0.35);
            transition: 0.2s ease;
        }

        /* This moves the button when the mouse is on it. */
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 38px rgba(37,99,235,0.46);
        }

        /* This styles the links area. */
        .backtologinlinkarea {
            margin-top: 16px;
            font-size: 14px;
            font-weight: 800;
        }

        /* This styles the back to login link. */
        .backtologinlinkarea a {
            color: var(--mainbluecolor);
            text-decoration: none;
            font-weight: 900;
        }

        /* This underlines the link when the mouse is on it. */
        .backtologinlinkarea a:hover {
            text-decoration: underline;
        }

        /* This styles error messages. */
        .errormessagebox {
            background: var(--softredcolor);
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 12px 14px;
            border-radius: 14px;
            margin-bottom: 14px;
            font-size: 14px;
            font-weight: 800;
            text-align: left;
        }

        /* This changes the page on small screens. */
        @media (max-width: 520px) {
            .toplogolinksbar,
            .bottomfooterbar {
                padding: 0 16px;
            }

            .newpasswordbluebackgroundarea {
                padding: 24px 16px;
            }

            .newpasswordcardbox {
                width: 100%;
                padding: 28px 22px;
                border-radius: 22px;
            }

            h2 {
                font-size: 27px;
            }

            .bottomfooterbar {
                height: auto;
                min-height: 58px;
                gap: 10px;
                flex-direction: column;
                justify-content: center;
            }

            .bottomfooterbar a {
                margin: 0 8px;
            }
        }
    </style>
</head>

<body>

<!-- This shows the top logo and links. -->
<div class="toplogolinksbar">
    <img src="{% static 'images/sky.png' %}" class="smallskylogo" alt="Sky">

    <div class="tophelpcontactlinks">
        <a href="#">Help</a>
        <a href="#">Contact</a>
    </div>
</div>

<!-- This shows the new password page area. -->
<div class="newpasswordbluebackgroundarea">

    <!-- This shows the new password card. -->
    <div class="newpasswordcardbox">

        <!-- This shows the OpenSky logo. -->
        <img src="{% static 'images/sky.png' %}" class="openskynewpasswordlogo" alt="OpenSky">

        <!-- This shows the main title. -->
        <h2>Create New Password</h2>

        <!-- This tells the user what to do. -->
        <div class="textundertitle">Choose and confirm your new password.</div>

        <!-- This separates the title from the form. -->
        <div class="formseparateline"></div>

        <!-- This shows error messages. -->
        {% if messages %}
            {% for message in messages %}
                <div class="errormessagebox">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <!-- This form updates the password. -->
        <form method="post">
            {% csrf_token %}

            <!-- This gets the new password. -->
            <input type="password" name="new_password" placeholder="New Password" required>

            <!-- This confirms the new password. -->
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>

            <!-- This saves the new password. -->
            <button type="submit">Update Password</button>
        </form>

        <!-- This goes back to the login page. -->
        <div class="backtologinlinkarea">
            <a href="/">Back to Login</a>
        </div>

    </div>
</div>

<!-- This shows the bottom footer bar. -->
<div class="bottomfooterbar">
    <div>© 2025 Sky. All rights reserved.</div>

    <div>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
    </div>
</div>

</body>
</html>
