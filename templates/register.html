{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>OpenSky Register</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #064fb0, #10b7df);
            min-height: 100vh;
        }

        .top-bar, .bottom-bar {
            height: 42px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            box-sizing: border-box;
        }

        .sky-logo { width: 55px; }

        .top-links a, .bottom-bar a {
            color: #555;
            font-size: 12px;
            text-decoration: none;
            margin-left: 12px;
        }

        .register-area {
            min-height: calc(100vh - 84px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 380px;
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.25);
            text-align: center;
        }

        .app-logo {
            width: 130px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 13px;
            color: #555;
            margin-bottom: 22px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            background: #00a9df;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #008fc0;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .success {
            background: #e7f7ec;
            color: #166534;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .login-link {
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link a {
            color: #009edb;
            text-decoration: none;
            font-weight: bold;
        }

        .bottom-bar {
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="top-bar">
    <img src="{% static 'images/sky.png' %}" class="sky-logo" alt="Sky">
    <div class="top-links">
        <a href="#">Help</a>
        <a href="#">Contact</a>
    </div>
</div>

<div class="register-area">
    <div class="register-card">

        <img src="{% static 'images/sky.png' %}" class="app-logo" alt="OpenSky">

        <h2>Create Account</h2>
        <div class="subtitle">Join OpenSky Engineering Team Directory</div>

        {% if messages %}
            {% for message in messages %}
                <div class="{% if message.tags == 'success' %}success{% else %}error{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label>Full Name</label>
            <input type="text" name="fullname" required>

            <label>Username</label>
            <input type="text" name="username" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <label>Confirm Password</label>
            <input type="password" name="confirm_password" required>

            <button type="submit" class="register-btn">Register</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="/">Sign in</a>
        </div>

    </div>
</div>

<div class="bottom-bar">
    <div>© 2025 Sky</div>
    <div>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
    </div>
</div>

</body>
</html>
