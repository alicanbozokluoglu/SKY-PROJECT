{% extends "base.html" %}

{% block content %}

<style>
    .new-message-wrap {
        max-width: 920px;
        margin: 0 auto;
    }

    .page-title {
        font-size: 28px;
        margin: 0 0 24px;
        color: #1f2937;
    }

    .form-card {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 28px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-weight: bold;
        color: #334155;
        margin-bottom: 8px;
        font-size: 14px;
    }

    select,
    input,
    textarea {
        width: 100%;
        border: 1px solid #d9dee8;
        border-radius: 8px;
        padding: 13px 14px;
        font-size: 15px;
        outline: none;
        font-family: Arial, sans-serif;
    }

    select:focus,
    input:focus,
    textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
    }

    textarea {
        min-height: 160px;
        resize: vertical;
    }

    .button-row {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 22px;
    }

    .cancel-btn {
        padding: 12px 18px;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        color: #334155;
        background: white;
        text-decoration: none;
        font-weight: bold;
    }

    .send-btn {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    .send-btn:hover {
        background: #1d4ed8;
    }

    .error-box {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 18px;
        font-size: 14px;
    }

    .empty {
        color: #667085;
        border: 1px dashed #d0d5dd;
        background: #f8fafc;
        border-radius: 10px;
        padding: 18px;
        font-size: 15px;
    }
</style>

<div class="new-message-wrap">

    <h1 class="page-title">New Message</h1>

    <div class="form-card">

        {% if messages %}
            {% for message in messages %}
                <div class="error-box">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% if teams %}
            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label>Select Team</label>

                    <select name="team" required>
                        <option value="">Choose a team...</option>

                        {% for team in teams %}
                            <option value="{{ team.id }}">{{ team.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" name="subject" required>
                </div>

                <div class="form-group">
                    <label>Message</label>
                    <textarea name="body" required></textarea>
                </div>

                <div class="button-row">
                    <a href="{% url 'messages' %}" class="cancel-btn">Cancel</a>
                    <button type="submit" class="send-btn">Send Message</button>
                </div>
            </form>
        {% else %}
            <div class="empty">
                No teams exist in the database. Add teams before sending messages.
            </div>
        {% endif %}

    </div>

</div>

{% endblock %}
