{% load static %}

<!DOCTYPE html>
<html>
<head>
    <!-- This sets the page title. -->
    <title>OpenSky Login</title>

    <style>
        /* This sets the page colors. */
        :root {
            --whitecardtransparentcolor: rgba(255, 255, 255, 0.92);
            --maintextcolor: #0f172a;
            --mutedtextcolor: #64748b;
            --borderlinecolor: #e2e8f0;
            --mainbluecolor: #2563eb;
            --darkbluecolor: #1e40af;
            --softbluecolor: #eff6ff;
            --softredcolor: #fee2e2;
            --bigboxshadow: 0 30px 80px rgba(2, 6, 23, 0.28);
            --boxroundcorner: 24px;
        }

        /* This makes width and height easier to control. */
        * {
            box-sizing: border-box;
        }

        /* This sets the page font and background. */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: var(--maintextcolor);
        }

        /* This styles the top white bar. */
        .toplogolinksbar {
            height: 58px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        /* This styles the small Sky logo. */
        .smallskylogo {
            width: 58px;
            display: block;
        }

        /* This holds the Help and Contact links. */
        .tophelpcontactlinks {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* This styles the Help and Contact links. */
        .tophelpcontactlinks a {
            color: #475569;
            font-size: 13px;
            text-decoration: none;
            font-weight: 800;
        }

        /* This changes top links when the mouse is on them. */
        .tophelpcontactlinks a:hover {
            color: var(--mainbluecolor);
        }

        /* This styles the blue login background area. */
        .loginbluebackgroundarea {
            position: relative;
            overflow: hidden;
            min-height: calc(100vh - 106px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 34px 18px;
            background:
                radial-gradient(circle at 15% 18%, rgba(56, 189, 248, 0.55), transparent 28%),
                radial-gradient(circle at 85% 20%, rgba(37, 99, 235, 0.50), transparent 30%),
                radial-gradient(circle at 50% 85%, rgba(14, 165, 233, 0.45), transparent 32%),
                linear-gradient(135deg, #020617 0%, #0f2f6f 45%, #0284c7 100%);
        }

        /* This adds a glass effect on the background. */
        .loginbluebackgroundarea::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(120deg, rgba(255,255,255,0.13), transparent 35%, rgba(255,255,255,0.08)),
                repeating-linear-gradient(
                    135deg,
                    rgba(255,255,255,0.04) 0px,
                    rgba(255,255,255,0.04) 1px,
                    transparent 1px,
                    transparent 18px
                );
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: none;
        }

        /* This adds a moving shine on the background. */
        .loginbluebackgroundarea::after {
            content: "";
            position: absolute;
            top: -35%;
            left: -55%;
            width: 70%;
            height: 170%;
            background: linear-gradient(
                115deg,
                transparent 0%,
                rgba(255,255,255,0.04) 35%,
                rgba(255,255,255,0.32) 50%,
                rgba(255,255,255,0.05) 65%,
                transparent 100%
            );
            transform: rotate(8deg);
            animation: loginpagebackgroundshine 7s ease-in-out infinite;
            pointer-events: none;
        }

        /* This moves the page shine. */
        @keyframes loginpagebackgroundshine {
            0% { left: -65%; opacity: 0; }
            18% { opacity: 0.75; }
            50% { left: 120%; opacity: 0; }
            100% { left: 120%; opacity: 0; }
        }

        /* This styles the login box. */
        .loginformcardbox {
            position: relative;
            z-index: 1;
            overflow: hidden;
            width: 390px;
            background: var(--whitecardtransparentcolor);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,0.65);
            border-radius: var(--boxroundcorner);
            padding: 34px;
            box-shadow: var(--bigboxshadow);
            text-align: center;
        }

        /* This adds a soft shine inside the login box. */
        .loginformcardbox::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background:
                linear-gradient(145deg, rgba(255,255,255,0.45), transparent 36%),
                linear-gradient(315deg, rgba(37,99,235,0.08), transparent 46%);
            pointer-events: none;
            z-index: 0;
        }

        /* This adds a moving shine on the login box. */
        .loginformcardbox::after {
            content: "";
            position: absolute;
            top: -80%;
            left: -75%;
            width: 65%;
            height: 240%;
            background: linear-gradient(
                115deg,
                transparent,
                rgba(255,255,255,0.12),
                rgba(255,255,255,0.68),
                rgba(255,255,255,0.12),
                transparent
            );
            transform: rotate(18deg);
            animation: logincardshineanimation 4.8s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        /* This moves the login box shine. */
        @keyframes logincardshineanimation {
            0% { left: -80%; opacity: 0; }
            20% { opacity: 0.9; }
            48% { left: 125%; opacity: 0; }
            100% { left: 125%; opacity: 0; }
        }

        /* This keeps login content above the shine effect. */
        .openskyloginlogo,
        h2,
        .loginappsubtitle,
        form,
        .loginerrormessagebox,
        .createnewaccountbutton {
            position: relative;
            z-index: 1;
        }

        /* This styles the main logo in the login box. */
        .openskyloginlogo {
            width: 132px;
            margin-bottom: 10px;
        }

        /* This styles the OpenSky title. */
        h2 {
            margin: 0;
            color: var(--maintextcolor);
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        /* This styles the small text under OpenSky. */
        .loginappsubtitle {
            font-size: 14px;
            color: var(--mutedtextcolor);
            margin-top: 7px;
            margin-bottom: 26px;
            font-weight: 700;
        }

        /* This styles form labels. */
        label {
            display: block;
            text-align: left;
            font-size: 12px;
            font-weight: 900;
            margin-top: 14px;
            margin-bottom: 8px;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* This styles inputs and dropdowns. */
        input,
        select {
            width: 100%;
            padding: 0 14px;
            height: 48px;
            border: 1px solid #dbe3ef;
            border-radius: 14px;
            font-size: 14px;
            color: var(--maintextcolor);
            background: rgba(255,255,255,0.86);
            outline: none;
            transition: 0.18s ease;
        }

        /* This highlights inputs and dropdowns when clicked. */
        input:focus,
        select:focus {
            border-color: var(--mainbluecolor);
            box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
            background: #ffffff;
        }

        /* This holds remember me and forgot password. */
        .rememberforgotrow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 14px 0 20px;
            font-size: 13px;
        }

        /* This styles the forgot password link. */
        .rememberforgotrow a {
            color: var(--mainbluecolor);
            text-decoration: none;
            font-weight: 800;
            white-space: nowrap;
        }

        /* This underlines the forgot password link when the mouse is on it. */
        .rememberforgotrow a:hover {
            text-decoration: underline;
        }

        /* This styles the remember me text. */
        .remembermelabel {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            font-weight: 800;
            text-transform: none;
            letter-spacing: 0;
            color: #475569;
            font-size: 13px;
            cursor: pointer;
        }

        /* This styles the remember me checkbox. */
        .remembermelabel input[type="checkbox"] {
            width: 17px;
            height: 17px;
            min-width: 17px;
            padding: 0;
            margin: 0;
            border-radius: 4px;
            accent-color: var(--mainbluecolor);
            box-shadow: none;
        }

        /* This styles login and register buttons. */
        .signinbutton,
        .createnewaccountbutton {
            width: 100%;
            display: block;
            padding: 13px;
            border-radius: 14px;
            font-weight: 900;
            text-align: center;
            font-size: 14px;
            transition: 0.2s ease;
        }

        /* This styles the sign in button. */
        .signinbutton {
            background: linear-gradient(135deg, var(--mainbluecolor), var(--darkbluecolor));
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 14px 30px rgba(37,99,235,0.35);
        }

        /* This moves the sign in button when the mouse is on it. */
        .signinbutton:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 38px rgba(37,99,235,0.46);
        }

        /* This styles the create account button. */
        .createnewaccountbutton {
            margin-top: 12px;
            border: 1px solid var(--borderlinecolor);
            color: var(--mainbluecolor);
            text-decoration: none;
            background: rgba(255,255,255,0.88);
        }

        /* This changes the create account button when the mouse is on it. */
        .createnewaccountbutton:hover {
            transform: translateY(-1px);
            background: #ffffff;
        }

        /* This styles error messages. */
        .loginerrormessagebox {
            background: var(--softredcolor);
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 14px;
        }

        /* This styles the bottom white bar. */
        .bottomfooterbar {
            height: 48px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-top: 1px solid #e5e7eb;
            font-size: 12px;
            color: #64748b;
            font-weight: 700;
        }

        /* This styles bottom links. */
        .bottomfooterbar a {
            color: #64748b;
            text-decoration: none;
            margin-left: 16px;
            font-weight: 800;
        }

        /* This changes bottom links when the mouse is on them. */
        .bottomfooterbar a:hover {
            color: var(--mainbluecolor);
        }

        /* This changes the page on small screens. */
        @media (max-width: 520px) {
            .toplogolinksbar,
            .bottomfooterbar {
                padding: 0 16px;
            }

            .loginformcardbox {
                width: 100%;
                padding: 28px 22px;
                border-radius: 22px;
            }

            .rememberforgotrow {
                align-items: flex-start;
                flex-direction: column;
            }

            .bottomfooterbar {
                height: auto;
                min-height: 58px;
                gap: 10px;
                flex-direction: column;
                justify-content: center;
            }

            .bottomfooterbar a {
                margin: 0 8px;
            }
        }
    </style>
</head>

<body>

<!-- This shows the top logo and links. -->
<div class="toplogolinksbar">
    <img src="{% static 'images/sky.png' %}" class="smallskylogo" alt="Sky">

    <div class="tophelpcontactlinks">
        <a href="#">Help</a>
        <a href="#">Contact</a>
    </div>
</div>

<!-- This shows the login area. -->
<div class="loginbluebackgroundarea">

    <!-- This shows the login box. -->
    <div class="loginformcardbox">

        <!-- This shows the OpenSky logo. -->
        <img src="{% static 'images/sky.png' %}" class="openskyloginlogo" alt="OpenSky">

        <!-- This shows the app name. -->
        <h2>OpenSky</h2>

        <!-- This shows the app subtitle. -->
        <div class="loginappsubtitle">Engineering Team Directory</div>

        <!-- This shows login errors. -->
        {% if messages %}
            {% for message in messages %}
                <div class="loginerrormessagebox">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <!-- This form logs the user in. -->
        <form method="post">
            {% csrf_token %}

            <!-- This selects normal login or admin login. -->
            <label for="role">Login Type</label>
            <select name="role" id="role" required>
                <option value="user">Member Login</option>
                <option value="admin">Admin Login</option>
            </select>

            <!-- This gets the email or username. -->
            <label for="username">Email / Username</label>
            <input type="text" name="username" id="username" required>

            <!-- This gets the password. -->
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required>

            <div class="rememberforgotrow">

                <!-- This remembers the user. -->
                <label class="remembermelabel" for="remember">
                    <input type="checkbox" name="remember" id="remember">
                    Remember me
                </label>

                <!-- This opens password reset. -->
                <a href="/reset/">Forgot password?</a>
            </div>

            <!-- This sends the login form. -->
            <button type="submit" class="signinbutton">Sign In</button>
        </form>

        <!-- This opens the register page. -->
        <a href="{% url 'register' %}" class="createnewaccountbutton">Create New Account</a>

    </div>
</div>

<!-- This shows the bottom footer bar. -->
<div class="bottomfooterbar">
    <div>© 2025 Sky. All rights reserved.</div>

    <div>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
    </div>
</div>

</body>
</html>
