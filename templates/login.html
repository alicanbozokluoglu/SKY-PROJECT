{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>OpenSky Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #064fb0, #10b7df);
            min-height: 100vh;
        }

        .top-bar {
            height: 42px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            box-sizing: border-box;
        }

        .sky-logo {
            width: 55px;
        }

        .top-links a {
            color: #555;
            font-size: 12px;
            text-decoration: none;
            margin-left: 12px;
        }

        .login-area {
            min-height: calc(100vh - 82px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 340px;
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.25);
            text-align: center;
        }

        .app-logo {
            width: 130px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 13px;
            color: #555;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: bold;
            margin-top: 14px;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 18px;
            font-size: 12px;
        }

        .row a {
            color: #009edb;
            text-decoration: none;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            font-weight: normal;
        }

        .remember input {
            width: auto;
        }

        .login-btn,
        .register-btn {
            width: 100%;
            box-sizing: border-box;
            display: block;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            font-size: 14px;
        }

        .login-btn {
            background: #00a9df;
            color: white;
            border: none;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #008fc0;
        }

        .register-btn {
            margin-top: 12px;
            border: 1px solid #00a9df;
            color: #00a9df;
            text-decoration: none;
            background: white;
        }

        .register-btn:hover {
            background: #e6f7fc;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .bottom-bar {
            height: 40px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            box-sizing: border-box;
            font-size: 12px;
            color: #777;
        }

        .bottom-bar a {
            color: #777;
            text-decoration: none;
            margin-left: 15px;
        }
    </style>
</head>

<body>

<div class="top-bar">
    <img src="{% static 'images/sky.png' %}" class="sky-logo" alt="Sky">

    <div class="top-links">
        <a href="#">Help</a>
        <a href="#">Contact</a>
    </div>
</div>

<div class="login-area">
    <div class="login-card">

        <img src="{% static 'images/sky.png' %}" class="app-logo" alt="OpenSky">

        <h2>OpenSky</h2>
        <div class="subtitle">Engineering Team Directory</div>

        {% if messages %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label>Login Type</label>
            <select name="role" required>
                <option value="user">Member Login</option>
                <option value="admin">Admin Login</option>
            </select>

            <label>Email / Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <div class="row">
                <label class="remember">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>

                <a href="/reset/">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <a href="{% url 'register' %}" class="register-btn">Create New Account</a>

    </div>
</div>

<div class="bottom-bar">
    <div>© 2025 Sky</div>

    <div>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
    </div>
</div>

</body>
</html>
