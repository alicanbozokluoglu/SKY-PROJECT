<!DOCTYPE html>
<html>
<head>
    <!-- This sets the page title. -->
    <title>Reset Password</title>
</head>
<body>

<!-- This shows the reset password title. -->
<h2>Reset Password</h2>

<!-- This form sends the password reset email. -->
<form method="post">
    <!-- This protects the form from unsafe requests. -->
    {% csrf_token %}

    <!-- This shows the password reset form fields. -->
    {{ form.as_p }}

    <!-- This button sends the form. -->
    <button type="submit">Send Reset Email</button>
</form>

</body>
</html>
