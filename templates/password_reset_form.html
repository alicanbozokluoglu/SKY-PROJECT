{% load static %}

<!DOCTYPE html>
<html>
<head>
    <!-- This sets the page title. -->
    <title>Reset Password | OpenSky</title>

    <style>
        /* This sets the page colors. */
        :root {
            --transparentwhitecardcolor: rgba(255, 255, 255, 0.92);
            --maintextcolor: #0f172a;
            --mutedtextcolor: #64748b;
            --borderlinecolor: #e2e8f0;
            --mainbluecolor: #2563eb;
            --darkbluecolor: #1e40af;
            --bigboxshadow: 0 30px 80px rgba(2, 6, 23, 0.28);
            --boxroundcorner: 24px;
        }

        /* This makes width and height easier to control. */
        * {
            box-sizing: border-box;
        }

        /* This sets the page font and background. */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: var(--maintextcolor);
        }

        /* This styles the top white bar. */
        .toplogolinksbar {
            height: 58px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid #e5e7eb;
        }

        /* This styles the Sky logo. */
        .smallskylogo {
            width: 58px;
        }

        /* This holds the Help and Contact links. */
        .tophelpcontactlinks {
            display: flex;
            gap: 16px;
        }

        /* This styles the Help and Contact links. */
        .tophelpcontactlinks a {
            color: #475569;
            font-size: 13px;
            text-decoration: none;
            font-weight: 800;
        }

        /* This changes top links when the mouse is on them. */
        .tophelpcontactlinks a:hover {
            color: var(--mainbluecolor);
        }

        /* This styles the blue middle page area. */
        .resetpasswordbluebackgroundarea {
            position: relative;
            overflow: hidden;
            min-height: calc(100vh - 106px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 34px 18px;

            background:
                radial-gradient(circle at 15% 18%, rgba(56, 189, 248, 0.55), transparent 28%),
                radial-gradient(circle at 85% 20%, rgba(37, 99, 235, 0.50), transparent 30%),
                radial-gradient(circle at 50% 85%, rgba(14, 165, 233, 0.45), transparent 32%),
                linear-gradient(135deg, #020617 0%, #0f2f6f 45%, #0284c7 100%);
        }

        /* This adds a moving shine on the blue area. */
        .resetpasswordbluebackgroundarea::after {
            content: "";
            position: absolute;
            top: -35%;
            left: -55%;
            width: 70%;
            height: 170%;
            background: linear-gradient(
                115deg,
                transparent 0%,
                rgba(255,255,255,0.04) 35%,
                rgba(255,255,255,0.32) 50%,
                rgba(255,255,255,0.05) 65%,
                transparent 100%
            );
            transform: rotate(8deg);
            animation: resetpasswordbackgroundshineanimation 7s ease-in-out infinite;
        }

        /* This moves the blue area shine. */
        @keyframes resetpasswordbackgroundshineanimation {
            0% { left: -65%; opacity: 0; }
            20% { opacity: 0.7; }
            50% { left: 120%; opacity: 0; }
            100% { left: 120%; opacity: 0; }
        }

        /* This styles the reset password card. */
        .resetpasswordcardbox {
            position: relative;
            z-index: 1;
            width: 430px;
            background: var(--transparentwhitecardcolor);
            backdrop-filter: blur(22px);
            border-radius: var(--boxroundcorner);
            padding: 34px;
            box-shadow: var(--bigboxshadow);
        }

        /* This adds a moving shine on the card. */
        .resetpasswordcardbox::after {
            content: "";
            position: absolute;
            top: -80%;
            left: -75%;
            width: 65%;
            height: 240%;
            background: linear-gradient(
                115deg,
                transparent,
                rgba(255,255,255,0.6),
                transparent
            );
            transform: rotate(18deg);
            animation: resetpasswordcardshineanimation 5s infinite;
        }

        /* This moves the card shine. */
        @keyframes resetpasswordcardshineanimation {
            0% { left: -80%; opacity: 0; }
            20% { opacity: 1; }
            50% { left: 120%; opacity: 0; }
            100% { left: 120%; opacity: 0; }
        }

        /* This centers the logo. */
        .logocenterarea {
            text-align: center;
            margin-bottom: 10px;
        }

        /* This styles the main OpenSky logo. */
        .openskyresetpasswordlogo {
            width: 132px;
        }

        /* This styles the main title. */
        h1 {
            margin: 10px 0 8px;
            text-align: center;
            font-size: 30px;
            font-weight: 900;
        }

        /* This styles the small text under the title. */
        .textundertitle {
            text-align: center;
            color: var(--mutedtextcolor);
            font-size: 14px;
            margin-bottom: 26px;
            font-weight: 700;
        }

        /* This styles form labels. */
        label {
            display: block;
            font-size: 12px;
            font-weight: 900;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        /* This styles the email input. */
        input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #dbe3ef;
            border-radius: 14px;
            margin-bottom: 16px;
        }

        /* This highlights the email input when clicked. */
        input:focus {
            border-color: var(--mainbluecolor);
            box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
        }

        /* This styles the send reset link button. */
        .sendresetlinkbutton {
            width: 100%;
            padding: 13px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--mainbluecolor), var(--darkbluecolor));
            color: white;
            font-weight: 900;
            border: none;
            cursor: pointer;
        }

        /* This styles the steps box. */
        .passwordresetstepsbox {
            margin-top: 24px;
            padding: 18px;
            background: #f8fafc;
            border-radius: 16px;
        }

        /* This styles one step line. */
        .passwordresetstepline {
            margin-bottom: 10px;
            font-weight: 700;
        }

        /* This styles the back to login link. */
        .backtologinlink {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--mainbluecolor);
            font-weight: 900;
            text-decoration: none;
        }

        /* This styles the bottom footer bar. */
        .bottomfooterbar {
            height: 48px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-top: 1px solid #e5e7eb;
            font-size: 12px;
            color: #64748b;
            font-weight: 700;
        }

        /* This styles bottom links. */
        .bottomfooterbar a {
            color: #64748b;
            text-decoration: none;
            margin-left: 16px;
            font-weight: 800;
        }

        /* This changes bottom links when the mouse is on them. */
        .bottomfooterbar a:hover {
            color: var(--mainbluecolor);
        }
    </style>
</head>

<body>

<!-- This shows the top logo and links. -->
<div class="toplogolinksbar">
    <img src="{% static 'images/sky.png' %}" class="smallskylogo">

    <div class="tophelpcontactlinks">
        <a href="#">Help</a>
        <a href="#">Contact</a>
    </div>
</div>

<!-- This shows the reset password page area. -->
<div class="resetpasswordbluebackgroundarea">

    <!-- This shows the reset password card. -->
    <div class="resetpasswordcardbox">

        <!-- This shows the OpenSky logo. -->
        <div class="logocenterarea">
            <img src="{% static 'images/sky.png' %}" class="openskyresetpasswordlogo">
        </div>

        <!-- This shows the page title. -->
        <h1>Reset Password</h1>

        <!-- This explains what the user should do. -->
        <div class="textundertitle">
            Enter your account email to receive a reset link.
        </div>

        <!-- This form sends the reset email. -->
        <form method="post">
            {% csrf_token %}

            <!-- This asks for the user's email address. -->
            <label>Email Address</label>
            {{ form.email }}

            <!-- This sends the reset link. -->
            <button type="submit" class="sendresetlinkbutton">Send Reset Link</button>
        </form>

        <!-- This explains the password reset steps. -->
        <div class="passwordresetstepsbox">
            <div class="passwordresetstepline">1. We send you an email</div>
            <div class="passwordresetstepline">2. Click the link</div>
            <div class="passwordresetstepline">3. Set new password</div>
        </div>

        <!-- This goes back to login. -->
        <a href="{% url 'login' %}" class="backtologinlink">Back to Login</a>

    </div>

</div>

<!-- This shows the bottom footer bar. -->
<div class="bottomfooterbar">
    <div>© 2025 Sky. All rights reserved.</div>

    <div>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
    </div>
</div>

</body>
</html>
