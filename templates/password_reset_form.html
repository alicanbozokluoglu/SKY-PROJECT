{% extends "base.html" %}
<!-- this page uses "base.html", so it will automatically include the sidebar, header, and footer -->

{% block content %}
<!-- everything inside this block will appear in the main section of the page -->


<!-- this container keeps everything in the center and makes the form look neat -->
<div style="max-width:400px; margin:40px auto;">


    <!-- this is the main title of the page -->
    <h2 style="text-align:center;">Reset Password</h2>


    <!-- this text explains what the user needs to do -->
    <p style="text-align:center; color:#555;">
        Enter your email to receive a reset link
    </p>


    <!-- this line is just a visual separator -->
    <hr>


    <!-- this form sends the email address to Django -->
    <form method="post">

        <!-- this is a security token -->
        <!-- it protects the form from fake or unsafe requests -->
        {% csrf_token %}


        <!-- this section shows the email input field -->
        <div style="margin-bottom:15px;">

            <!-- this shows the label (like "Email") -->
            {{ form.email.label_tag }}<br>

            <!-- this shows the actual input box -->
            {{ form.email }}

        </div>


        <!-- this button sends the form -->
        <button type="submit"
            style="
                width:100%;
                padding:10px;
                background:#0072ce;
                color:white;
                border:none;
                cursor:pointer;
            ">
            Send Reset Email
        </button>

    </form>

</div>


{% endblock %}

<!--This page collects the user’s email and sends a password reset request using Django’s authentication system.-->
